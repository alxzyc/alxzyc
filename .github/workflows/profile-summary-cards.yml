name: GitHub-Profile-Summary-Cards

on:
  # Roda todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Se der "Resource not accessible by integration" ou faltarem cards,
          # troque por um Personal Access Token salvo em Settings > Secrets:
          # GITHUB_TOKEN: ${{ secrets.PROFILE_CARDS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          
